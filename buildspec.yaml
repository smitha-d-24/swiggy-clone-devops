version: 0.2

env:
  parameter-store:
    DOCKER_USERNAME: "/cicd/docker-credentials/username"
    DOCKER_PASSWORD: "/cicd/docker-credentials/password"
    DOCKER_REGISTRY: "/cicd/docker-registry/url"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies"
      - npm install

  pre_build:
    commands:
      - echo "Logging into DockerHub"
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t swiggy-clone .
      - docker tag swiggy-clone "$DOCKER_USERNAME/swiggy-clone:latest"

  post_build:
    commands:
      - echo "Pushing Docker image"
      - docker push "$DOCKER_USERNAME/swiggy-clone:latest"
      - printf '[{"name":"swiggy","imageUri":"%s"}]' "$DOCKER_USERNAME/swiggy-clone:latest" > imagedefinitions.json
      - echo "Build completed successfully"

artifacts:
  files:
    - appspec.yaml
    - imagedefinitions.json
