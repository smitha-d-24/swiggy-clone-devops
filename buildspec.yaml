version: 0.2

env:
  parameter-store:
    DOCKER_USERNAME: "/cicd/docker-credentials/username"
    DOCKER_PASSWORD: "/cicd/docker-credentials/password"
    DOCKER_REGISTRY: "/cicd/docker-registry/url"

phases:
  install:
    runtime-versions:
      nodejs: 18
      java: corretto17
    commands:
      - echo "Installing dependencies"
      - npm install

      - echo "Installing Trivy"
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o install-trivy.sh
      - chmod +x install-trivy.sh
      - ./install-trivy.sh -b ./bin
      - export PATH=$PATH:$PWD/bin
      - ./bin/trivy --version

      - echo "Installing OWASP Dependency Check"
      - wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
      - unzip dependency-check-9.0.9-release.zip

  pre_build:
    commands:
      - echo "Running Trivy filesystem scan"
      - ./bin/trivy fs --exit-code 0 --no-progress . > trivy-fs-report.txt

      - echo "Running OWASP Dependency Check"
      - ./dependency-check/bin/dependency-check.sh --scan . --format HTML --out . --nvdApiKey "$NVD_API_KEY" || true

      - echo "Logging into DockerHub"
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t swiggy-clone .
      - docker tag swiggy-clone "$DOCKER_USERNAME/swiggy-clone:latest"

  post_build:
    commands:
      - echo "Pushing Docker image"
      - docker push "$DOCKER_USERNAME/swiggy-clone:latest"
      - printf '[{"name":"swiggy","imageUri":"%s"}]' "$DOCKER_USERNAME/swiggy-clone:latest" > imagedefinitions.json
      - echo "Build completed successfully"

artifacts:
  files:
    - appspec.yaml
    - imagedefinitions.json
    - trivy-fs-report.txt
    - dependency-check-report.html
  discard-paths: yes
