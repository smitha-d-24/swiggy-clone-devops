steps:

# Install Node Dependencies
- name: 'node:18'
  entrypoint: 'npm'
  args: ['install']

# SonarQube Scan
- name: 'sonarsource/sonar-scanner-cli:latest'
  entrypoint: 'sh'
  secretEnv:
    - SONAR_TOKEN
  args:
    - '-c'
    - |
      sonar-scanner \
      -Dsonar.projectKey=swiggy-clone \
      -Dsonar.projectBaseDir=/workspace \
      -Dsonar.sources=/workspace \
      -Dsonar.working.directory=/tmp/.scannerwork \
      -Dsonar.host.url=$_SONAR_HOST \
      -Dsonar.token=$$SONAR_TOKEN

# OWASP Dependency Check
- name: 'owasp/dependency-check:latest'
  entrypoint: 'sh'
  secretEnv:
    - NVD_API_KEY
  args:
    - '-c'
    - |
      mkdir -p /tmp/dependency-check-report

      /usr/share/dependency-check/bin/dependency-check.sh \
        --project "swiggy-clone" \
        --scan /workspace \
        --exclude "**/node_modules/**" \
        --format HTML \
        --format JSON \
        --out /tmp/dependency-check-report \
        --nvdApiKey $$NVD_API_KEY \
        --disableYarnAudit \
        --disableNodeAudit || true
  env:
    - 'HOME=/tmp'

# Upload OWASP Report to GCS
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      if [ -d /tmp/dependency-check-report ]; then
        gcloud storage cp --recursive /tmp/dependency-check-report gs://smitha-owasp-reports/$BUILD_ID/
      else
        echo "OWASP report folder not found, skipping upload"
      fi

# Build Docker Image
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA'
    - '.'

# Trivy Image Scan
- name: 'aquasec/trivy:latest'
  args:
    - 'image'
    - '--severity'
    - 'HIGH,CRITICAL'
    - '--exit-code'
    - '0'
    - 'asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA'

# Push Docker Image
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - 'asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA'

# Deploy Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - run
    - deploy
    - smitha-swiggy-service
    - --image
    - asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA
    - --region
    - asia-south1
    - --platform
    - managed
    - --allow-unauthenticated
    - --labels
    - owner=smitha

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/smitha-sonar-token/versions/latest
      env: SONAR_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/smitha-nvd-api-key/versions/latest
      env: NVD_API_KEY

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
