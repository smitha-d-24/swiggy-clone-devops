steps:

# Install Node Dependencies
- name: 'node:18'
  entrypoint: 'npm'
  args: ['install']

# SonarQube Scan
- name: 'sonarsource/sonar-scanner-cli:latest'
  entrypoint: 'sh'
  secretEnv:
    - SONAR_TOKEN
    - SONAR_HOST
  args:
    - '-c'
    - |
      sonar-scanner \
      -Dsonar.projectKey=swiggy-clone \
      -Dsonar.sources=. \
      -Dsonar.host.url=$$SONAR_HOST \
      -Dsonar.token=$$SONAR_TOKEN

# Build Docker Image
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA'
    - '.'

# Push Docker Image
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - 'asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA'

# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - run
    - deploy
    - smitha-swiggy-service
    - --image
    - asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA
    - --region
    - asia-south1
    - --platform
    - managed
    - --allow-unauthenticated

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/smitha-sonar-token/versions/latest
      env: SONAR_TOKEN

    - versionName: projects/$PROJECT_ID/secrets/smitha-sonar-host/versions/latest
      env: SONAR_HOST

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/smitha-artifact-repo/swiggy-clone:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
